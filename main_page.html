<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies | Opawiks Homelab</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrapper header-row">
      <a class="logo" href="/">Opawiks Homelab</a>
      <nav aria-label="Main">
        <a href="/photos/">Photos</a>
        <a href="/roms/">ROMs</a>
        <a href="/movies/" aria-current="page">Movies</a>
        <form method="post" action="/logout">
          <button class="logout-button" type="submit">Log out</button>
        </form>
      </nav>
    </div>
  </header>

  <main class="wrapper roms-page">
    <h1>Movies</h1>
    <p class="roms-summary" id="movie-summary">Loading your library...</p>

    <div class="roms-tools">
      <input type="search" id="movie-search" placeholder="Search movies" aria-label="Search movies">
    </div>

    <div class="movie-grid" id="movie-grid"></div>
  </main>

  <script>
    // Gets the movie list from the server, which asks Jellyfin.
    const grid = document.getElementById("movie-grid");
    const summary = document.getElementById("movie-summary");
    const search = document.getElementById("movie-search");
    let movies = [];
    let jellyfin = "";

    // Makes one card per movie. Clicking it opens the movie in Jellyfin.
    function show(list) {
      grid.innerHTML = "";
      for (const movie of list) {
        const card = document.createElement("a");
        card.className = "movie-card";
        card.href = `${jellyfin}/web/#/details?id=${movie.id}&serverId=${movie.server}`;
        card.target = "_blank";
        card.rel = "noopener";

        const poster = document.createElement("div");
        poster.className = "movie-poster";
        const image = document.createElement("img");
        image.src = `/movies/poster/${movie.id}`;
        image.alt = "";
        image.loading = "lazy";
        image.onerror = () => image.remove(); // No poster: keep the empty box
        poster.append(image);

        const name = document.createElement("span");
        name.className = "movie-name";
        name.textContent = movie.year ? `${movie.name} (${movie.year})` : movie.name;

        card.append(poster, name);
        grid.append(card);
      }
    }

    fetch("/movies/api")
      .then((response) => {
        if (!response.ok) throw new Error();
        return response.json();
      })
      .then((data) => {
        jellyfin = data.jellyfin;
        movies = data.movies;
        const word = movies.length === 1 ? "movie" : "movies";
        summary.textContent = `${movies.length} ${word}. Click one to watch it in Jellyfin.`;
        show(movies);
      })
      .catch(() => {
        summary.textContent = "Couldn't reach Jellyfin. Check that it's running.";
      });

    search.addEventListener("input", () => {
      const text = search.value.trim().toLowerCase();
      show(movies.filter((movie) => movie.name.toLowerCase().includes(text)));
    });
  </script>
</body>
</html>
